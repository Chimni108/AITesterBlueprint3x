<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QABuddy.ai</title>
<style>
  :root { --bg:#0f1117; --panel:#181b23; --border:#2a2f3a; --text:#e6e8ee; --dim:#9aa1af; --accent:#4f8ef7; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  header h1 { font-size:16px; margin:0; }
  header .sub { color:var(--dim); font-size:12px; }
  #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; max-width:900px; width:100%; margin:0 auto; }
  .msg { padding:12px 14px; border-radius:10px; white-space:pre-wrap; line-height:1.5; font-size:14px; }
  .user { background:var(--accent); color:#fff; align-self:flex-end; max-width:75%; }
  .bot { background:var(--panel); border:1px solid var(--border); align-self:flex-start; max-width:90%; }
  .sources { font-size:12px; color:var(--dim); margin-top:8px; border-top:1px dashed var(--border); padding-top:6px; }
  .sources span { display:inline-block; margin:2px 6px 2px 0; padding:2px 8px; background:#232734; border-radius:12px; }
  form { display:flex; gap:8px; padding:14px 20px; border-top:1px solid var(--border); max-width:900px; width:100%; margin:0 auto; }
  input { flex:1; padding:12px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:14px; }
  button { padding:12px 22px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <h1>🤖 QABuddy.ai</h1>
  <span class="sub">Hybrid RAG over frameworks · test cases · JIRA · PRDs · logs — answers with citations</span>
</header>
<div id="log"></div>
<form id="form">
  <input id="q" placeholder="Ask anything — e.g. 'Why is TC-1042 flaky?' or 'How do we handle waits in the Selenium framework?'" autocomplete="off" autofocus>
  <button id="send" type="submit">Ask</button>
</form>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const q = document.getElementById("q");
const send = document.getElementById("send");

function add(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = q.value.trim();
  if (!question) return;
  add("user", question);
  q.value = "";
  send.disabled = true;

  const bot = add("bot", "");
  let sourcesDiv = null;

  try {
    const resp = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === "delta") {
          bot.textContent += ev.text;
        } else if (ev.type === "sources" && ev.sources.length) {
          sourcesDiv = document.createElement("div");
          sourcesDiv.className = "sources";
          for (const s of ev.sources) {
            const chip = document.createElement("span");
            chip.textContent = `[${s.n}] ${s.citation}`;
            sourcesDiv.appendChild(chip);
          }
        } else if (ev.type === "error") {
          bot.textContent += "\n⚠ " + ev.message;
        }
        log.scrollTop = log.scrollHeight;
      }
    }
    if (sourcesDiv) bot.appendChild(sourcesDiv);
  } catch (err) {
    bot.textContent += "\n⚠ Connection error: " + err.message;
  } finally {
    send.disabled = false;
    q.focus();
  }
});
</script>
</body>
</html>
