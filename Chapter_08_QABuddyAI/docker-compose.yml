services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-4-8}
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./data:/app/data          # source folders + ingest state survive redeploys
      - model_cache:/root/.cache  # FastEmbed model downloads
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
  model_cache:
